services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timelog}
      POSTGRES_USER: ${POSTGRES_USER:-timelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?Set AUTHENTICATOR_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timelog} -d ${POSTGRES_DB:-timelog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - timelog

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-timelog}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PUBLIC_URL:-http://localhost}/rest/v1
    networks:
      - timelog

  auth:
    build:
      context: .
      dockerfile: docker/auth-Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      DATABASE_URL: postgres://${POSTGRES_USER:-timelog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-timelog}
      AUTH_PORT: "3001"
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-14d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks:
      - timelog

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      ANON_KEY: ${ANON_KEY:?Run ./scripts/setup.sh first}
      AUTO_CONNECT: ${AUTO_CONNECT:-true}
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - timelog

volumes:
  postgres_data:

networks:
  timelog:
    driver: bridge
