# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: always

  postgrest:
    restart: always

  web:
    restart: always
    # BIND_ADDRESS=127.0.0.1 (default) or 0.0.0.0 if NPM runs in Docker (use 172.17.0.1 in NPM)
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
