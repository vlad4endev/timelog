# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: always

  postgrest:
    restart: always

  web:
    restart: always
    # Bind to localhost only — put host Caddy/nginx in front, or use deploy.sh tls
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
